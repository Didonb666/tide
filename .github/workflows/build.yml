name: Build APK & EXE

# 什么时候自动跑：
#   1. 你往 main（或 master）分支推送代码；
#   2. 有人提交 Pull Request；
#   3. 你手动点 "Run workflow"。
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

# 同一分支只保留最新一次构建，避免排队浪费额度。
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Job 1：Android APK（Ubuntu 上跑）
  # ---------------------------------------------------------------------------
  android:
    name: 构建 Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: 1. 检出仓库代码
        uses: actions/checkout@v4

      - name: 2. 安装 JDK 17（Android Gradle 需要）
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: 3. 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          # 想锁定版本时取消下面这行注释（版本号去 flutter.dev/releases 查）：
          # flutter-version: 3.35.1

      - name: 4. 打印环境信息
        run: |
          flutter --version
          java -version

      - name: 5. 生成 Android 平台目录
        # 仓库里只保留了自定义的 MainActivity / Manifest / 图标相关文件，
        # gradle、gradle wrapper、res 这些模板文件由这条命令补齐。
        # `flutter create` 默认不覆盖已存在的文件，所以自定义代码不会被冲掉。
        run: flutter create --platforms=android --org com.tide --project-name tide .

      - name: 5b. 自检：自定义原生文件还在
        run: |
          grep -q "TunnelChannel" android/app/src/main/kotlin/com/tide/tide/MainActivity.kt \
            && echo "OK: MainActivity 未被覆盖" \
            || echo "::warning::MainActivity 可能被 flutter create 覆盖，请检查仓库里的 android/ 目录"
          grep -q 'android:label="Tide"' android/app/src/main/AndroidManifest.xml \
            && echo "OK: Manifest 未被覆盖" \
            || echo "::warning::Manifest 可能被 flutter create 覆盖"

      - name: 6. 拉取 Dart 依赖
        run: flutter pub get

      - name: 7. 编译 Release APK
        run: flutter build apk --release

      - name: 8. 显示产物信息
        run: ls -lh build/app/outputs/flutter-apk/

      - name: 9. 上传 APK（在 Actions 页面可下载）
        uses: actions/upload-artifact@v4
        with:
          name: tide-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

  # ---------------------------------------------------------------------------
  # Job 2：Windows EXE（Windows 上跑）
  # ---------------------------------------------------------------------------
  windows:
    name: 构建 Windows EXE
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: 1. 检出仓库代码
        uses: actions/checkout@v4

      - name: 2. 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: 3. 打开 Windows 桌面支持
        run: flutter config --enable-windows-desktop

      - name: 4. 生成 Windows 平台目录
        # 生成 CMake / runner 等模板；我们自定义的文件不会被覆盖。
        run: flutter create --platforms=windows --org com.tide --project-name tide .

      - name: 5. 拉取 Dart 依赖
        run: flutter pub get

      - name: 6. 编译 Release EXE
        run: flutter build windows --release

      - name: 7. 收集产物（exe 必须带着同目录的 dll 和 data 才能运行）
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path build/windows -Recurse -Filter tide.exe |
                 Select-Object -First 1
          if (-not $exe) {
            Write-Error "没有找到 tide.exe，构建可能失败了"
            exit 1
          }
          $dir = $exe.Directory.FullName
          Write-Host "Release 目录: $dir"
          New-Item -ItemType Directory -Force dist/windows | Out-Null
          Copy-Item -Path (Join-Path $dir '*') -Destination dist/windows -Recurse -Force
          Get-ChildItem dist/windows | Select-Object Name, Length

      - name: 8. 上传 EXE（在 Actions 页面可下载，解压即用）
        # 直接上传目录：GitHub 会自动压成一个 zip，解压后就是程序目录，
        # 不会出现"zip 里还套一个 zip"的情况。
        uses: actions/upload-artifact@v4
        with:
          name: tide-windows-x64
          path: dist/windows/
          if-no-files-found: error
          retention-days: 30
