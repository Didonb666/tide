name: Build APK & EXE

# 四个 Job：
#   dart-check —— 只编译 Dart（约 1~2 分钟），语法错误在这里就暴露，不用等内核
#   core       —— 用 Go + gomobile 把 mihomo 编成 Android 用的 core.aar（约 15~25 分钟）
#   android    —— 下载 core.aar，接进 APK
#   windows    —— 独立编 Windows 版本
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Job 0：Dart 预检（最快失败）
  # ---------------------------------------------------------------------------
  dart-check:
    name: Dart 语法预检（约 2 分钟）
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 1. 检出仓库代码
        uses: actions/checkout@v4

      - name: 2. 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: 3. 拉取 Dart 依赖
        run: flutter pub get

      - name: 4. 只编译 Dart（不碰 Android / Windows 原生）
        run: flutter build bundle --release

  # ---------------------------------------------------------------------------
  # Job 1：编译 mihomo 内核
  # ---------------------------------------------------------------------------
  core:
    name: 编译 mihomo 内核（AAR）
    needs: dart-check
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: 1. 检出仓库代码
        uses: actions/checkout@v4

      - name: 2. 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache: false

      - name: 3. 安装 Android NDK
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c

      - name: 4. 安装 gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: 5. 克隆 mihomo 源码并打补丁（跳过读取 packages.xml）
        run: |
          git clone --depth 1 --branch v1.19.33 https://github.com/MetaCubeX/mihomo.git native/mihomo
          python3 - <<'PY'
          import re
          from pathlib import Path

          p = Path("native/mihomo/listener/sing_tun/server_android.go")
          src = p.read_text(encoding="utf-8")

          pattern = r"func \(l \*Listener\) buildAndroidRules\(tunOptions \*tun\.Options\) error \{.*?\n\}"
          replacement = (
              "func (l *Listener) buildAndroidRules(tunOptions *tun.Options) error {\n"
              "\t// PATCHED: 普通 App 无权读取 /data/system/packages.xml。\n"
              "\t// 本项目不做分应用代理，直接跳过 Android 的 per-app 规则构建。\n"
              "\t_ = tunOptions\n"
              "\treturn nil\n"
              "}"
          )

          patched, count = re.subn(pattern, replacement, src, count=1, flags=re.S)
          if count != 1:
              raise SystemExit("patch failed: buildAndroidRules anchor not found")

          p.write_text(patched, encoding="utf-8")
          print("patched buildAndroidRules -> no-op")
          PY
          grep -n "PATCHED" native/mihomo/listener/sing_tun/server_android.go

      - name: 6. 拉取 mihomo 源码依赖
        working-directory: native/corebridge
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.ndk.outputs.ndk-path }}
          GOFLAGS: -mod=mod
        run: |
          go version
          echo "NDK: $ANDROID_NDK_HOME"

          if ! go mod download golang.org/x/mobile; then
            echo "::warning::固定的 golang.org/x/mobile 版本不可用，改用 @latest 自动修复"
            go get -tool golang.org/x/mobile/cmd/gobind@latest
          fi

          go mod download
          go mod tidy -e || echo "::warning::tidy 报告了非致命错误，继续构建"

          echo "--- 关键模块版本 ---"
          go list -m github.com/metacubex/mihomo golang.org/x/mobile

      - name: 7. 编译 core.aar
        working-directory: native/corebridge
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.ndk.outputs.ndk-path }}
          GOFLAGS: -mod=mod
        run: |
          gomobile init
          # -javapkg 是"包前缀"：com.tide + core + Core = com.tide.core.Core
          gomobile bind \
            -target=android/arm64 \
            -androidapi 26 \
            -javapkg com.tide \
            -tags with_gvisor \
            -ldflags "-s -w -extldflags=-Wl,-z,max-page-size=16384" \
            -o core.aar .
          ls -lh core.aar

      - name: 8. 上传 AAR
        uses: actions/upload-artifact@v4
        with:
          name: mihomo-core-aar
          path: native/corebridge/core.aar
          if-no-files-found: error
          retention-days: 30

  # ---------------------------------------------------------------------------
  # Job 2：Android APK
  # ---------------------------------------------------------------------------
  android:
    name: 构建 Android APK
    needs: [dart-check, core]
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: 1. 检出仓库代码
        uses: actions/checkout@v4

      - name: 2. 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: 3. 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: 4. 生成 Android 平台目录
        run: flutter create --platforms=android --org com.tide --project-name tide .

      - name: 5. 下载内核 AAR
        uses: actions/download-artifact@v4
        with:
          name: mihomo-core-aar
          path: android/app/libs

      - name: 6. 修改 build.gradle.kts（minSdk 26 + 引入 AAR）
        run: python3 scripts/patch_android_gradle.py

      - name: 7. 自检：原生文件与 AAR 就位
        run: |
          ls -lh android/app/libs/core.aar
          grep -q "TunnelChannel" android/app/src/main/kotlin/com/tide/tide/MainActivity.kt \
            && echo "OK: MainActivity 未被覆盖" \
            || echo "::warning::MainActivity 可能被 flutter create 覆盖"
          grep -q "BIND_VPN_SERVICE" android/app/src/main/AndroidManifest.xml \
            && echo "OK: Manifest 含 VPN 服务" \
            || echo "::warning::Manifest 缺少 VPN 服务声明"

      - name: 8. 拉取 Dart 依赖
        run: flutter pub get

      - name: 9. 编译 Release APK
        shell: bash
        run: |
          set -o pipefail
          flutter build apk --release 2>&1 | tee android-build.log

      - name: 9b. 失败时提取 Dart / Kotlin 错误
        if: failure()
        run: |
          echo "================ 编译错误 ================"
          grep -E "\.dart:[0-9]+:[0-9]+|^e: |^error:|Error:" android-build.log | head -n 80 || true
          echo "=========================================="

      - name: 9c. 失败时上传完整构建日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-log
          path: android-build.log
          if-no-files-found: warn
          retention-days: 7

      - name: 10. 显示产物信息
        run: ls -lh build/app/outputs/flutter-apk/

      - name: 11. 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: tide-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

  # ---------------------------------------------------------------------------
  # Job 3：Windows EXE
  # ---------------------------------------------------------------------------
  windows:
    name: 构建 Windows EXE
    needs: dart-check
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: 1. 检出仓库代码
        uses: actions/checkout@v4

      - name: 2. 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: 3. 打开 Windows 桌面支持
        run: flutter config --enable-windows-desktop

      - name: 4. 生成 Windows 平台目录
        run: flutter create --platforms=windows --org com.tide --project-name tide .

      - name: 5. 拉取 Dart 依赖
        run: flutter pub get

      - name: 6. 编译 Release EXE
        shell: pwsh
        run: |
          flutter build windows --release 2>&1 | Tee-Object -FilePath windows-build.log
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            Write-Host ""
            Write-Host "================ 构建失败，最后 80 行 ================"
            Get-Content windows-build.log -Tail 80
            Write-Host "====================================================="
            exit $code
          }

      - name: 6b. 失败时上传完整构建日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-build-log
          path: windows-build.log
          if-no-files-found: warn
          retention-days: 7

      - name: 7. 收集产物
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path build/windows -Recurse -Filter tide.exe |
                 Select-Object -First 1
          if (-not $exe) {
            Write-Error "没有找到 tide.exe，构建可能失败了"
            exit 1
          }
          $dir = $exe.Directory.FullName
          Write-Host "Release 目录: $dir"
          New-Item -ItemType Directory -Force dist/windows | Out-Null
          Copy-Item -Path (Join-Path $dir '*') -Destination dist/windows -Recurse -Force
          Get-ChildItem dist/windows | Select-Object Name, Length

      - name: 8. 上传 EXE（解压即用）
        uses: actions/upload-artifact@v4
        with:
          name: tide-windows-x64
          path: dist/windows/
          if-no-files-found: error
          retention-days: 30
