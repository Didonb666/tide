name: tide
description: "Fstool —— 以 Clash.Meta 规则为核心的跨平台代理客户端。"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.2.2
  file_selector: ^1.0.3
  image_picker: ^1.1.2
  video_player: ^2.9.2
  path_provider: ^2.1.4
  flutter_colorpicker: ^1.1.0
  mobile_scanner: ^5.2.3
  webview_flutter: ^4.10.0
  liquid_glass_renderer: ^1.0.0-dev.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/folia/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 26
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/icon/app_icon.png"
